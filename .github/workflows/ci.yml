name: Tipi CI
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run lint and tests
        run: make ci

      - name: Validate Renovate configuration
        run: make renovate-config-test

      # Renovate PRs fail here until update-tipi-version.yml pushes its bump commit.
      - name: Check tipi_version bump
        run: make check-tipi-version BASE="${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}"
