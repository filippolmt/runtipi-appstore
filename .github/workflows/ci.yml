name: Tipi CI
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run lint and tests
        run: make ci

      - name: Validate Renovate configuration
        run: make renovate-config-test

      # Renovate PRs get their bump from update-tipi-version.yml in a follow-up commit.
      - name: Check tipi_version bump
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'renovate[bot]'
        run: scripts/check-tipi-version.sh "origin/${{ github.base_ref }}"
