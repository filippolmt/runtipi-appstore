name: Update tipi_version on Renovate PR

on:
  # Not pull_request_target: GitHub blocks it by default on public repos from 2026-12-02.
  # Renovate branches live in this repo, so pull_request still gets secrets and write permissions.
  # Trade-offs: no run while the PR has a merge conflict (Renovate's rebase re-fires it), and the
  # workflow file comes from the PR head, so a renovate[bot] PR runs its own copy of it.
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'apps/**/docker-compose.json'
      - 'apps/**/config.json'
      - 'apps/**/metadata/**'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to re-apply tipi_version bump'
        required: true
        type: number

# PR-derived values (branch names, file paths, Makefile contents) reach `run:` scripts only
# through env vars, never as inline ${{ }} expressions, so they cannot inject shell code.
jobs:
  update-tipi-version:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.actor == 'renovate[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Resolve PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            pr_data=$(gh pr view "$INPUT_PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefName,baseRefName)
            {
              echo "number=$INPUT_PR_NUMBER"
              echo "head_ref=$(jq -r '.headRefName' <<<"$pr_data")"
              echo "base_ref=$(jq -r '.baseRefName' <<<"$pr_data")"
              echo "repo=$GITHUB_REPOSITORY"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "number=$EVENT_PR_NUMBER"
              echo "head_ref=$EVENT_HEAD_REF"
              echo "base_ref=$EVENT_BASE_REF"
              echo "repo=$EVENT_HEAD_REPO"
            } >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.head_ref }}
          repository: ${{ steps.pr.outputs.repo }}
          fetch-depth: 0
          # Push the bump commit with a PAT, not GITHUB_TOKEN. GITHUB_TOKEN pushes
          # don't fire pull_request events, so CI never reports a PR-linked `ci`
          # check and the required-status-check gate stays unsatisfied (PR BLOCKED).
          # A PAT push fires `synchronize`, so ci.yml runs natively and its check is
          # linked to the PR. The PAT owner is not renovate[bot], so the resulting
          # synchronize re-run of THIS workflow is skipped by the actor gate above.
          token: ${{ secrets.BUMP_PAT }}

      - name: Setup git remote
        env:
          BUMP_PAT: ${{ secrets.BUMP_PAT }}
          REPO: ${{ steps.pr.outputs.repo }}
        run: git remote set-url origin "https://x-access-token:${BUMP_PAT}@github.com/${REPO}.git"

      - name: Read BUN_IMAGE from Makefile
        id: bun
        run: echo "image=$(sed -n 's/^BUN_IMAGE ?= //p' Makefile)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        env:
          BUN_IMAGE: ${{ steps.bun.outputs.image }}
        run: docker run --rm -v "$PWD:/app" -w /app "$BUN_IMAGE" bun install --ignore-scripts

      - name: Get changed files
        id: changed
        env:
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
        run: |
          git fetch origin "$BASE_REF"
          files=$(git diff --name-only "origin/${BASE_REF}...HEAD" | grep 'docker-compose.json' | tr '\n' ' ')
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "Changed docker-compose.json files: $files"

      - name: Update config.json for each changed app
        if: steps.changed.outputs.files != ''
        env:
          BUN_IMAGE: ${{ steps.bun.outputs.image }}
          FILES: ${{ steps.changed.outputs.files }}
        run: |
          # Paths are apps/<app-id>/docker-compose.json: no spaces, so word splitting is safe.
          for file in $FILES; do
            if [[ -f "$file" ]]; then
              app_dir=$(dirname "$file")
              config_file="$app_dir/config.json"

              if [[ -f "$config_file" ]]; then
                # Extract package name and new version from the isMain service
                main_image=$(jq -r '.services[] | select(.isMain == true) | .image' "$file")
                package_name=$(echo "$main_image" | cut -d: -f1)
                new_version=$(echo "$main_image" | cut -d: -f2-)

                if [[ -n "$new_version" ]]; then
                  echo "Updating $config_file: version=$new_version, package=$package_name"
                  docker run --rm -v "$PWD:/app" -w /app "$BUN_IMAGE" bun run scripts/update-config.ts "$file" "$new_version" "$package_name"
                  echo "Updated tipi_version and updated_at in $config_file"
                fi
              fi
            fi
          done

      - name: Format updated files
        if: steps.changed.outputs.files != ''
        env:
          BUN_IMAGE: ${{ steps.bun.outputs.image }}
        run: docker run --rm -v "$PWD:/app" -w /app "$BUN_IMAGE" bun run lint

      - name: Regenerate README
        run: make readme

      - name: Commit and push changes
        id: commit
        env:
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/*/config.json README.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: sync renovate metadata and readme"
            git push origin "HEAD:${HEAD_REF}"
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # The bump push fires a `synchronize` event, so ci.yml runs natively and its
      # check is linked to the PR head — no manual workflow_dispatch needed.
      # That same push disables the native auto-merge Renovate armed at PR creation,
      # so re-arm it here for automerge-labelled PRs. GitHub then merges (squash)
      # once the required `ci` check goes green. GITHUB_TOKEN suffices (PR write).
      - name: Re-enable auto-merge on automerge PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          if gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json labels \
               --jq '.labels[].name' | grep -qx 'automerge'; then
            gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash
          else
            echo "PR #$PR_NUMBER has no 'automerge' label; skipping auto-merge."
          fi
